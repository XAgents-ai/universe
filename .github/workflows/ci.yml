name: Physics and Replay CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: universe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies only (no model secrets)
        run: python -m pip install -r requirements.txt
      - name: Install workflow-policy validator dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate collaboration workflow boundaries
        run: python scripts/test_workflow_boundaries.py
      - name: Test protected path validator against actual Git modifications
        run: python scripts/test_protected_path_validator.py
      - name: Compile sources
        run: python -m compileall -q .
      - name: Run deterministic acceptance suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          bash run_checks.sh 2>&1 | tee ci-checks.log
      - name: Upload CI trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: universe-acceptance-py${{ matrix.python-version }}
          path: ci-checks.log
          if-no-files-found: warn
          retention-days: 30
